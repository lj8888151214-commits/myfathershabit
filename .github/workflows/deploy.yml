name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create dummy application.properties for packaging
        run: |
          mkdir -p src/main/resources
          echo "spring.application.name=RC" > src/main/resources/application.properties

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/RC-*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/RC-*.jar"
          target: "/home/ec2-user/shop/"
          strip_components: 1

      - name: Restart Application on EC2
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              cd /home/ec2-user/shop
              
              # 1. 8080 포트를 점유 중인 프로세스 안전 종료 (자기 자신 kill 방지)
              CURRENT_PID=$(lsof -ti :8080)
              if [ -n "$CURRENT_PID" ]; then
                echo "Killing existing process on port 8080 (PID: $CURRENT_PID)"
                kill -15 $CURRENT_PID || kill -9 $CURRENT_PID
                sleep 5
              fi
              
              # 2. .env 환경 변수 주입
              if [ -f ".env" ]; then
                set -a
                source .env
                set +a
              fi
              
              # 3. 신규 JAR 백그라운드 실행 및 SSH 세션 완전 분리
              JAR_NAME=$(ls -tr RC-*.jar | tail -n 1)
              nohup java -jar $JAR_NAME > nohup.out 2>&1 &
              sleep 2
              exit 0